<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نصب بازی Fox Eggs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 28px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .game-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border-radius: 28px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            box-shadow: 0 12px 30px rgba(255, 210, 0, 0.3);
        }
        
        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .stores-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            color: #ffffff;
        }
        
        .store-btn:active {
            transform: scale(0.97);
        }
        
        .btn-myket {
            background: linear-gradient(135deg, #00b894, #00a381);
            box-shadow: 0 8px 20px rgba(0, 184, 148, 0.35);
        }
        
        .btn-myket:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 184, 148, 0.5);
        }
        
        .btn-bazaar {
            background: linear-gradient(135deg, #0984e3, #0873c7);
            box-shadow: 0 8px 20px rgba(9, 132, 227, 0.35);
        }
        
        .btn-bazaar:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(9, 132, 227, 0.5);
        }
        
        .store-icon {
            font-size: 28px;
            line-height: 1;
        }
        
        .store-label {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.3;
        }
        
        .store-name {
            font-size: 18px;
            font-weight: 700;
        }
        
        .store-action {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
        }
        
        .footer-text {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
        }
        
        @media (max-width: 400px) {
            .container {
                padding: 28px 16px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .store-btn {
                padding: 14px 18px;
                font-size: 16px;
            }
            
            .game-icon {
                width: 100px;
                height: 100px;
                font-size: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- آیکون بازی -->
        <div class="game-icon">🦊</div>
        
        <!-- عنوان -->
        <h1>روباه تخم‌مرغی</h1>
        <p class="subtitle">Fox Eggs — ماجراجویی جذاب و پر هیجان</p>
        
        <!-- دکمه‌های نصب -->
        <div class="stores-grid">
            <!-- مایکت -->
            <a href="https://myket.ir/app/com.foxeggs.game" 
               class="store-btn btn-myket"
               target="_blank"
               rel="noopener noreferrer">
                <span class="store-icon">📱</span>
                <span class="store-label">
                    <span class="store-name">مایکت</span>
                    <span class="store-action">نصب از مایکت</span>
                </span>
            </a>
            
            <!-- بازار -->
            <a href="http://cafebazaar.ir/app/?id=com.foxeggs.game&ref=share" 
               class="store-btn btn-bazaar"
               target="_blank"
               rel="noopener noreferrer">
                <span class="store-icon">🏪</span>
                <span class="store-label">
                    <span class="store-name">بازار اندروید</span>
                    <span class="store-action">نصب از بازار</span>
                </span>
            </a>
        </div>
        
        <p class="footer-text">با کلیک روی هر دکمه به فروشگاه مربوطه هدایت می‌شوید</p>
    </div>
</body>
</html>
